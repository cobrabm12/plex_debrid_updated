services:
  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./zurg/config.yml:/app/config.yml
      - ./zurg/data:/app/data

  plex_debrid:
    build: ./plex_debrid_src
    image: plex_debrid_local
    container_name: plex_debrid
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      # Optional credential overrides, read from a local .env file (see .env.example).
      # Left empty -> the app falls back to its built-in shared public defaults.
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - DEBRIDLINK_CLIENT_ID=${DEBRIDLINK_CLIENT_ID:-}
      - ORIONOID_CLIENT_ID=${ORIONOID_CLIENT_ID:-}
      - RD_API_KEY=${RD_API_KEY:-}
    volumes:
      - ./plex_debrid/config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true # Important for interactive setup if needed
    tty: true        # Important for interactive setup if needed
    depends_on:
      - zurg

  # -------------------------------------------------------------------------
  # Optional services below only start when their profile is enabled (the
  # installer sets COMPOSE_PROFILES in .env). On Linux the "rclone" service
  # mounts the Zurg WebDAV into ./data and shares it with Plex/Jellyfin so they
  # can read your debrid library. FUSE mount sharing needs a Linux host
  # (cap_add SYS_ADMIN + /dev/fuse); on Windows/macOS run the media servers
  # natively and use the rclone.exe drive instead.
  # -------------------------------------------------------------------------
  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    profiles: ["rclone"]
    environment:
      - TZ=${TZ:-Europe/Bucharest}
    volumes:
      - ./rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - ./data:/data:rshared
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse:/dev/fuse:rwm
    command: "mount zurg: /data --allow-other --allow-non-empty --dir-cache-time 10s --vfs-cache-mode full --umask 002"
    depends_on:
      - zurg

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    profiles: ["plex"]
    ports:
      - 32400:32400
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Bucharest}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./plex/config:/config
      - ./data:/data:rslave
    depends_on:
      - rclone

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    profiles: ["jellyfin"]
    ports:
      - 8096:8096
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Bucharest}
    volumes:
      - ./jellyfin/config:/config
      - ./data:/data:rslave
    depends_on:
      - rclone

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    profiles: ["jellyseerr"]
    ports:
      - 5055:5055
    environment:
      - TZ=${TZ:-Europe/Bucharest}
    volumes:
      - ./jellyseerr/config:/app/config

  # Local Torrentio-style Stremio addon (plex_debrid scrapers + Real-Debrid).
  # Reuses the plex_debrid image; install http://<host>:7000/manifest.json in Stremio.
  stremio_addon:
    image: plex_debrid_local
    container_name: stremio_addon
    restart: unless-stopped
    profiles: ["addon"]
    command: python stremio_addon.py
    environment:
      - TZ=${TZ:-Europe/Bucharest}
      - ADDON_PORT=7000
      - PD_CONFIG_DIR=/config
      - RD_API_KEY=${RD_API_KEY:-}
      - ADDON_SOURCES=${ADDON_SOURCES:-torrentio}
    ports:
      - 7000:7000
    volumes:
      - ./plex_debrid/config:/config
    depends_on:
      - plex_debrid
      - zurg
